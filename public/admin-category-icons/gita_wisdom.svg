<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="Bhagavad Gita Wisdom">
  <defs>
    <!-- Background Divine Sky -->
    <radialGradient id="gitaBg" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#E0F7FA"/>
      <stop offset="30%" stop-color="#B2EBF2"/>
      <stop offset="65%" stop-color="#0097A7"/>
      <stop offset="100%" stop-color="#006064"/>
    </radialGradient>
    <!-- Peacock Feather Eye -->
    <radialGradient id="peacockEye" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1A237E"/>
      <stop offset="35%" stop-color="#0D47A1"/>
      <stop offset="60%" stop-color="#00E5FF"/>
      <stop offset="85%" stop-color="#FFD600"/>
      <stop offset="100%" stop-color="#2E7D32"/>
    </radialGradient>
    <!-- Golden Flute -->
    <linearGradient id="goldFlute" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFDE7"/>
      <stop offset="30%" stop-color="#FFD54F"/>
      <stop offset="70%" stop-color="#FF8F00"/>
      <stop offset="100%" stop-color="#E65100"/>
    </linearGradient>
    <!-- Sacred Book Cover -->
    <linearGradient id="bookCover" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF8A65"/>
      <stop offset="50%" stop-color="#D84315"/>
      <stop offset="100%" stop-color="#BF360C"/>
    </linearGradient>
    <!-- Book Pages -->
    <linearGradient id="bookPages" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFF9C4"/>
      <stop offset="50%" stop-color="#FFFDE7"/>
      <stop offset="100%" stop-color="#FFF59D"/>
    </linearGradient>
  </defs>

  <!-- Sky Circle -->
  <circle cx="64" cy="64" r="60" fill="url(#gitaBg)"/>

  <!-- Divine Rays -->
  <circle cx="64" cy="46" r="36" fill="#FFFDE7" opacity="0.2"/>

  <!-- Beautiful Peacock Feather (Mor Pankh) rising majestically -->
  <g transform="translate(64, 38)">
    <!-- Feather Stem -->
    <path d="M0 45 C-4 25 -2 0 4 -22" fill="none" stroke="#FFF9C4" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Outer Green/Teal Barbs -->
    <ellipse cx="6" cy="-14" rx="22" ry="26" fill="#1B5E20" opacity="0.85"/>
    <ellipse cx="6" cy="-14" rx="19" ry="23" fill="#2E7D32"/>
    <!-- Golden Ring in Eye -->
    <ellipse cx="6" cy="-12" rx="14" ry="17" fill="#FBC02D"/>
    <!-- Turquoise Ring -->
    <ellipse cx="6" cy="-12" rx="10" ry="12" fill="#00E5FF"/>
    <!-- Deep Royal Blue Center -->
    <ellipse cx="6" cy="-12" rx="6.5" ry="8" fill="#1A237E"/>
    <!-- Sparkle dot -->
    <circle cx="8" cy="-14" r="2" fill="#FFFFFF"/>
    <!-- Feather Fringe lines -->
    <path d="M-12 -28 C-4 -20 16 -20 24 -28" stroke="#7CB342" stroke-width="1.2" fill="none"/>
    <path d="M-15 -14 C-4 -8 16 -8 27 -14" stroke="#7CB342" stroke-width="1.2" fill="none"/>
    <path d="M-14 0 C-4 6 16 6 25 0" stroke="#7CB342" stroke-width="1.2" fill="none"/>
  </g>

  <!-- Open Sacred Bhagavad Gita Scripture / Book in Foreground -->
  <!-- Left Page -->
  <path d="M64 88 C48 82 28 84 18 86 L18 114 C28 112 48 110 64 116 Z" fill="url(#bookPages)"/>
  <path d="M16 86 L16 116 L64 118" stroke="#BF360C" stroke-width="3" fill="none"/>
  <!-- Right Page -->
  <path d="M64 88 C80 82 100 84 110 86 L110 114 C100 112 80 110 64 116 Z" fill="url(#bookPages)"/>
  <path d="M112 86 L112 116 L64 118" stroke="#BF360C" stroke-width="3" fill="none"/>
  <!-- Book Spine Center -->
  <line x1="64" y1="88" x2="64" y2="117" stroke="#8D6E63" stroke-width="2"/>
  <!-- Sanskrit Verse lines on pages -->
  <g stroke="#BCAAA4" stroke-width="1.4" stroke-linecap="round">
    <line x1="24" y1="92" x2="56" y2="90"/>
    <line x1="24" y1="98" x2="56" y2="96"/>
    <line x1="24" y1="104" x2="54" y2="102"/>
    <line x1="72" y1="90" x2="104" y2="92"/>
    <line x1="72" y1="96" x2="104" y2="98"/>
    <line x1="74" y1="102" x2="104" y2="104"/>
  </g>

  <!-- Lord Krishna's Divine Golden Flute (Bansuri) resting across book -->
  <g transform="rotate(-18, 64, 76)">
    <!-- Flute Body -->
    <rect x="18" y="72" width="92" height="7" rx="3.5" fill="url(#goldFlute)"/>
    <!-- Tone Holes -->
    <circle cx="48" cy="75.5" r="1.6" fill="#3E2723"/>
    <circle cx="58" cy="75.5" r="1.6" fill="#3E2723"/>
    <circle cx="68" cy="75.5" r="1.6" fill="#3E2723"/>
    <circle cx="78" cy="75.5" r="1.6" fill="#3E2723"/>
    <circle cx="88" cy="75.5" r="1.6" fill="#3E2723"/>
    <!-- Flute Mouth Hole -->
    <circle cx="30" cy="75.5" r="2.2" fill="#3E2723"/>
    <!-- Golden Tassel & Silk Thread hanging from Flute End -->
    <path d="M106 76 C112 82 108 90 114 96" fill="none" stroke="#FFD54F" stroke-width="2"/>
    <circle cx="114" cy="97" r="2.5" fill="#D50000"/>
  </g>
</svg>