<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="Bonalu">
  <defs>
    <!-- Background Festive Aura -->
    <radialGradient id="bonaluBg" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#FFFDE7"/>
      <stop offset="35%" stop-color="#FFF176"/>
      <stop offset="70%" stop-color="#F57C00"/>
      <stop offset="100%" stop-color="#880E4F"/>
    </radialGradient>
    <!-- Turmeric Yellow Clay Pot Gradient -->
    <radialGradient id="turmericPot" cx="40%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#FFF59D"/>
      <stop offset="40%" stop-color="#FBC02D"/>
      <stop offset="80%" stop-color="#F57F17"/>
      <stop offset="100%" stop-color="#E65100"/>
    </radialGradient>
    <!-- Vermilion Kumkum Red -->
    <linearGradient id="kumkumStripes" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF1744"/>
      <stop offset="50%" stop-color="#D50000"/>
      <stop offset="100%" stop-color="#880E4F"/>
    </linearGradient>
    <!-- Neem Leaf Green -->
    <linearGradient id="neemGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#B9F6CA"/>
      <stop offset="40%" stop-color="#00C853"/>
      <stop offset="85%" stop-color="#1B5E20"/>
      <stop offset="100%" stop-color="#003300"/>
    </linearGradient>
    <!-- Deepam Flame -->
    <linearGradient id="bFlame" x1="50%" y1="100%" x2="50%" y2="0%">
      <stop offset="0%" stop-color="#2979FF"/>
      <stop offset="25%" stop-color="#FF3D00"/>
      <stop offset="65%" stop-color="#FFEA00"/>
      <stop offset="100%" stop-color="#FFFFFF"/>
    </linearGradient>
  </defs>

  <!-- Halo -->
  <circle cx="64" cy="64" r="60" fill="url(#bonaluBg)"/>

  <!-- Pot Shadow -->
  <ellipse cx="64" cy="116" rx="34" ry="7" fill="#3E2723" opacity="0.4"/>

  <!-- Main Round Kalasham / Pot Body -->
  <circle cx="64" cy="84" r="30" fill="url(#turmericPot)"/>

  <!-- Kumkum (Vermilion) Sacred Stripes on Pot -->
  <path d="M60 55 C58 72 58 96 60 113 L68 113 C70 96 70 72 68 55 Z" fill="url(#kumkumStripes)"/>
  <path d="M46 62 C40 76 40 92 46 106 L51 103 C46 91 46 77 51 65 Z" fill="url(#kumkumStripes)"/>
  <path d="M82 62 C88 76 88 92 82 106 L77 103 C82 91 82 77 77 65 Z" fill="url(#kumkumStripes)"/>

  <!-- Turmeric Dots on Kumkum Stripes -->
  <circle cx="64" cy="70" r="2" fill="#FFFDE7"/>
  <circle cx="64" cy="84" r="2.5" fill="#FFFDE7"/>
  <circle cx="64" cy="98" r="2" fill="#FFFDE7"/>
  <circle cx="47" cy="84" r="1.8" fill="#FFFDE7"/>
  <circle cx="81" cy="84" r="1.8" fill="#FFFDE7"/>

  <!-- Pot Neck & Rim -->
  <ellipse cx="64" cy="56" rx="20" ry="6" fill="#F57F17"/>
  <ellipse cx="64" cy="55" rx="18" ry="4.5" fill="#FFF59D"/>

  <!-- Fresh Green Neem Leaves (Vepa Aakulu) spreading around the neck -->
  <!-- Left Leaves -->
  <path d="M48 54 C34 44 26 48 20 46 C24 54 36 58 48 54 Z" fill="url(#neemGreen)"/>
  <path d="M50 51 C38 38 32 38 28 32 C34 42 44 48 50 51 Z" fill="url(#neemGreen)"/>
  <path d="M52 48 C44 32 38 28 38 20 C46 28 50 38 52 48 Z" fill="url(#neemGreen)"/>
  <!-- Right Leaves -->
  <path d="M80 54 C94 44 102 48 108 46 C104 54 92 58 80 54 Z" fill="url(#neemGreen)"/>
  <path d="M78 51 C90 38 96 38 100 32 C94 42 84 48 78 51 Z" fill="url(#neemGreen)"/>
  <path d="M76 48 C84 32 90 28 90 20 C82 28 78 38 76 48 Z" fill="url(#neemGreen)"/>
  <!-- Central Leaves -->
  <path d="M60 48 C58 32 54 26 50 18 C58 26 62 36 60 48 Z" fill="url(#neemGreen)"/>
  <path d="M68 48 C70 32 74 26 78 18 C70 26 66 36 68 48 Z" fill="url(#neemGreen)"/>

  <!-- Top Sacred Deepam (Jyothi) resting on the Pot -->
  <ellipse cx="64" cy="46" rx="14" ry="5" fill="#BF360C"/>
  <ellipse cx="64" cy="45" rx="12" ry="3.5" fill="#FFB300"/>

  <!-- Bright Glowing Flame on Bonalu Pot -->
  <path d="M64 12 C56 24 52 34 52 42 C52 50 58 54 64 54 C70 54 76 50 76 42 C76 34 72 24 64 12 Z" 
        fill="url(#bFlame)"/>
  <ellipse cx="64" cy="42" rx="4" ry="7" fill="#FFFFFF"/>
</svg>