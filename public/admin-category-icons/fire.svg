<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="Motivational Torch">
  <defs>
    <!-- Background Power Glow -->
    <radialGradient id="torchGlow" cx="50%" cy="40%" r="58%">
      <stop offset="0%" stop-color="#FFFDE7"/>
      <stop offset="30%" stop-color="#FFE082"/>
      <stop offset="60%" stop-color="#FF5722"/>
      <stop offset="100%" stop-color="#210500"/>
    </radialGradient>
    <!-- Golden Torch Handle -->
    <linearGradient id="torchGold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFE082"/>
      <stop offset="30%" stop-color="#FFF9C4"/>
      <stop offset="65%" stop-color="#FFB300"/>
      <stop offset="100%" stop-color="#E65100"/>
    </linearGradient>
    <!-- Roaring Fire Flames -->
    <linearGradient id="fireOuter" x1="50%" y1="100%" x2="50%" y2="0%">
      <stop offset="0%" stop-color="#D50000"/>
      <stop offset="35%" stop-color="#FF3D00"/>
      <stop offset="70%" stop-color="#FF9100"/>
      <stop offset="100%" stop-color="#FFEA00"/>
    </linearGradient>
    <linearGradient id="fireInner" x1="50%" y1="100%" x2="50%" y2="0%">
      <stop offset="0%" stop-color="#FF6D00"/>
      <stop offset="40%" stop-color="#FFD600"/>
      <stop offset="80%" stop-color="#FFFF8D"/>
      <stop offset="100%" stop-color="#FFFFFF"/>
    </linearGradient>
  </defs>

  <!-- Halo Circle -->
  <circle cx="64" cy="64" r="60" fill="url(#torchGlow)"/>

  <!-- Golden Torch Pedestal / Handle -->
  <!-- Bottom Grip -->
  <path d="M58 84 L56 116 C56 120 72 120 72 116 L70 84 Z" fill="url(#torchGold)"/>
  <!-- Grip Rings -->
  <line x1="57" y1="92" x2="71" y2="92" stroke="#E65100" stroke-width="2"/>
  <line x1="57" y1="100" x2="71" y2="100" stroke="#E65100" stroke-width="2"/>
  <line x1="56.5" y1="108" x2="71.5" y2="108" stroke="#E65100" stroke-width="2"/>
  <ellipse cx="64" cy="116" rx="8" ry="3" fill="#BF360C"/>

  <!-- Upper Torch Bowl / Chalice -->
  <path d="M42 66 C42 80 54 86 64 86 C74 86 86 80 86 66 L90 56 L38 56 Z" fill="url(#torchGold)"/>
  <!-- Bowl Rim -->
  <ellipse cx="64" cy="56" rx="26" ry="6" fill="#BF360C"/>
  <ellipse cx="64" cy="55" rx="24" ry="4" fill="#FFEA00"/>
  <!-- Decorative Wings on Torch -->
  <path d="M42 70 C34 72 32 80 34 86 C38 84 42 78 44 74 Z" fill="url(#torchGold)"/>
  <path d="M86 70 C94 72 96 80 94 86 C90 84 86 78 84 74 Z" fill="url(#torchGold)"/>

  <!-- Roaring Blazing Motivational Fire -->
  <!-- Outer Wide Flames -->
  <path d="M64 8 C44 26 36 38 42 54 C46 48 52 46 50 56 C56 46 64 36 64 24 C68 34 76 42 80 54 C84 46 88 50 86 54 C92 40 84 26 64 8 Z" 
        fill="url(#fireOuter)"/>

  <!-- Inner Dynamic Blazing Core -->
  <path d="M64 18 C52 32 48 42 52 52 C55 46 60 46 58 52 C63 44 68 36 64 24 C68 32 72 40 74 52 C76 48 80 50 78 52 C82 42 76 30 64 18 Z" 
        fill="url(#fireInner)"/>

  <!-- White-Hot Intense Core -->
  <ellipse cx="64" cy="44" rx="7" ry="12" fill="#FFFFFF"/>
  <ellipse cx="64" cy="48" rx="4" ry="7" fill="#FFFDE7"/>

  <!-- Flying Dynamic Fire Sparks & Embers -->
  <g fill="#FFF9C4">
    <circle cx="54" cy="14" r="1.8"/>
    <circle cx="74" cy="12" r="2.2"/>
    <circle cx="64" cy="4" r="1.5"/>
    <circle cx="36" cy="30" r="1.4"/>
    <circle cx="92" cy="28" r="1.6"/>
    <circle cx="48" cy="22" r="1.2"/>
    <circle cx="80" cy="20" r="1.4"/>
  </g>
</svg>