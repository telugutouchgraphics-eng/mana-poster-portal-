<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="Good Morning Temple Sunrise">
  <defs>
    <!-- Dawn Sky Gradient -->
    <linearGradient id="dawnSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF6F00"/>
      <stop offset="30%" stop-color="#FF8F00"/>
      <stop offset="55%" stop-color="#FFA000"/>
      <stop offset="75%" stop-color="#FFD54F"/>
      <stop offset="90%" stop-color="#FFF9C4"/>
      <stop offset="100%" stop-color="#FFE082"/>
    </linearGradient>
    <!-- Radiant Rising Sun -->
    <radialGradient id="risingSun" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="35%" stop-color="#FFFDE7"/>
      <stop offset="65%" stop-color="#FFF59D"/>
      <stop offset="90%" stop-color="#FFD54F"/>
      <stop offset="100%" stop-color="#FF9800"/>
    </radialGradient>
    <!-- Sun Ray Glow -->
    <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.8"/>
      <stop offset="40%" stop-color="#FFE082" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#FF6F00" stop-opacity="0"/>
    </radialGradient>
    <!-- Water / Pond Reflection -->
    <linearGradient id="morningWater" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFA726"/>
      <stop offset="50%" stop-color="#FB8C00"/>
      <stop offset="100%" stop-color="#E65100"/>
    </linearGradient>
    <!-- Lotus Gradients -->
    <linearGradient id="lotusPink" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#C2185B"/>
      <stop offset="50%" stop-color="#E91E63"/>
      <stop offset="85%" stop-color="#F48FB1"/>
      <stop offset="100%" stop-color="#FFFFFF"/>
    </linearGradient>
    <!-- Temple Silhouette -->
    <linearGradient id="templeSilhouette" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5D4037"/>
      <stop offset="50%" stop-color="#3E2723"/>
      <stop offset="100%" stop-color="#1B0000"/>
    </linearGradient>
  </defs>

  <!-- Sky Circle -->
  <circle cx="64" cy="64" r="60" fill="url(#dawnSky)"/>

  <!-- Radiating Sunbeams -->
  <g opacity="0.4" stroke="#FFFDE7" stroke-width="3">
    <line x1="64" y1="56" x2="64" y2="10"/>
    <line x1="64" y1="56" x2="30" y2="18"/>
    <line x1="64" y1="56" x2="98" y2="18"/>
    <line x1="64" y1="56" x2="8" y2="40"/>
    <line x1="64" y1="56" x2="120" y2="40"/>
    <line x1="64" y1="56" x2="16" y2="68"/>
    <line x1="64" y1="56" x2="112" y2="68"/>
  </g>

  <!-- Big Glowing Radiant Sun rising over horizon -->
  <circle cx="64" cy="56" r="32" fill="url(#sunGlow)"/>
  <circle cx="64" cy="56" r="22" fill="url(#risingSun)"/>

  <!-- Birds in the Morning Sky -->
  <g fill="none" stroke="#4E342E" stroke-width="1.8" stroke-linecap="round">
    <path d="M26 32 C29 30 31 32 34 32 C37 32 39 30 42 32"/>
    <path d="M88 28 C91 26 93 28 96 28 C99 28 101 26 104 28"/>
    <path d="M74 20 C76 19 78 20 80 20 C82 20 84 19 86 20"/>
  </g>

  <!-- Sacred South Indian Temple Gopuram Silhouette in the Background -->
  <!-- Left Gopuram Silhouette -->
  <g fill="url(#templeSilhouette)">
    <!-- Kalashams on top -->
    <path d="M36 46 L36 42 L37 42 L37 46 Z"/>
    <circle cx="36.5" cy="41" r="1.5" fill="#FFE082"/>
    <path d="M42 43 L42 38 L43 38 L43 43 Z"/>
    <circle cx="42.5" cy="37" r="1.8" fill="#FFE082"/>
    <path d="M48 46 L48 42 L49 42 L49 46 Z"/>
    <circle cx="48.5" cy="41" r="1.5" fill="#FFE082"/>
    <!-- Gopuram Tiers -->
    <polygon points="42.5,43 35,50 50,50"/>
    <polygon points="42.5,49 33,58 52,58"/>
    <polygon points="42.5,57 30,68 55,68"/>
    <polygon points="42.5,67 27,80 58,80"/>
    <rect x="25" y="80" width="35" height="12"/>
    <!-- Temple Door Arch -->
    <path d="M40 92 C40 85 45 85 45 92 Z" fill="#FF8F00"/>
  </g>

  <!-- Water Surface with Morning Sun Reflection -->
  <path d="M4 88 C30 84 98 84 124 88 L124 124 C100 128 28 128 4 124 Z" fill="url(#morningWater)"/>
  <!-- Water Light Ripples -->
  <g stroke="#FFF9C4" stroke-width="1.6" opacity="0.7" stroke-linecap="round">
    <line x1="52" y1="92" x2="76" y2="92"/>
    <line x1="44" y1="96" x2="84" y2="96"/>
    <line x1="56" y1="100" x2="72" y2="100"/>
    <line x1="48" y1="104" x2="80" y2="104"/>
  </g>

  <!-- Blooming Sacred Pink Lotus in the Foreground (Right Center) -->
  <g transform="translate(82, 94)">
    <!-- Big Center Leaf Pad -->
    <ellipse cx="0" cy="18" rx="28" ry="7" fill="#2E7D32"/>
    <ellipse cx="0" cy="18" rx="24" ry="5" fill="#43A047"/>
    <!-- Lotus Outer Petals -->
    <path d="M-18 8 C-24 -4 -12 -12 -6 -2 C-10 6 -14 8 -18 8 Z" fill="url(#lotusPink)"/>
    <path d="M18 8 C24 -4 12 -12 6 -2 C10 6 14 8 18 8 Z" fill="url(#lotusPink)"/>
    <!-- Lotus Center Petals -->
    <path d="M-10 10 C-16 -8 0 -18 0 -18 C0 -18 16 -8 10 10 Z" fill="url(#lotusPink)"/>
    <!-- Lotus Bud Core -->
    <path d="M-6 8 C-8 -4 0 -14 0 -14 C0 -14 8 -4 6 8 Z" fill="#FFFDE7"/>
    <circle cx="0" cy="0" r="3" fill="#FFEB3B"/>
  </g>
</svg>