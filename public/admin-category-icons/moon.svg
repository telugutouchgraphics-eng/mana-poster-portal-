<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="Good Night Moon">
  <defs>
    <!-- Deep Indigo Night Sky Gradient -->
    <radialGradient id="nightSky" cx="50%" cy="45%" r="58%">
      <stop offset="0%" stop-color="#1A237E"/>
      <stop offset="40%" stop-color="#0D1B2A"/>
      <stop offset="80%" stop-color="#050B14"/>
      <stop offset="100%" stop-color="#000408"/>
    </radialGradient>
    <!-- Moon Gold & Silver Glow -->
    <linearGradient id="moonGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="30%" stop-color="#FFF9C4"/>
      <stop offset="65%" stop-color="#FFD54F"/>
      <stop offset="100%" stop-color="#FFB300"/>
    </linearGradient>
    <!-- Soft Night Cloud -->
    <linearGradient id="nightCloud" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3949AB" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#1A237E" stop-opacity="0.95"/>
    </linearGradient>
  </defs>

  <!-- Sky Circle -->
  <circle cx="64" cy="64" r="60" fill="url(#nightSky)"/>

  <!-- Moon Ambient Light Aura -->
  <circle cx="60" cy="54" r="38" fill="#FFF9C4" opacity="0.18"/>
  <circle cx="60" cy="54" r="28" fill="#FFF9C4" opacity="0.25"/>

  <!-- Twinkling Stars in Night Sky -->
  <g fill="#FFFFFF">
    <!-- Star 1 -->
    <polygon points="32,22 34,16 36,22 42,24 36,26 34,32 32,26 26,24" opacity="0.9"/>
    <!-- Star 2 -->
    <polygon points="98,32 99,28 101,32 105,33 101,34 99,38 98,34 94,33" opacity="0.85"/>
    <!-- Star 3 -->
    <polygon points="88,82 89,78 91,82 95,83 91,84 89,88 88,84 84,83" opacity="0.8"/>
    <!-- Star 4 -->
    <polygon points="24,76 25,73 27,76 30,77 27,78 25,81 24,78 21,77" opacity="0.75"/>
    <!-- Distant Star Dots -->
    <circle cx="48" cy="18" r="1.2" opacity="0.6"/>
    <circle cx="76" cy="16" r="1.5" opacity="0.8"/>
    <circle cx="106" cy="54" r="1.2" opacity="0.7"/>
    <circle cx="20" cy="46" r="1.4" opacity="0.5"/>
  </g>

  <!-- Glowing 3D Crescent Moon (Chandamama) -->
  <g transform="translate(6, 2)">
    <path d="M68 20 C42 20 28 38 28 60 C28 82 44 98 68 98 C54 94 44 80 44 60 C44 40 54 26 68 20 Z" 
          fill="url(#moonGlow)"/>
    <!-- Moon Inner Rim Highlight -->
    <path d="M68 20 C44 24 34 38 34 60 C34 78 42 90 64 96 C50 90 42 78 42 60 C42 42 52 28 68 20 Z" 
          fill="#FFFFFF" opacity="0.8"/>
    <!-- Gentle Moon Crater Texture -->
    <circle cx="42" cy="48" r="3" fill="#FFCA28" opacity="0.5"/>
    <circle cx="36" cy="62" r="2.2" fill="#FFCA28" opacity="0.5"/>
    <circle cx="46" cy="74" r="2.8" fill="#FFCA28" opacity="0.5"/>
  </g>

  <!-- Soft Dreamy Night Clouds drifting across bottom of moon -->
  <g fill="url(#nightCloud)">
    <path d="M22 96 C16 96 12 91 14 85 C16 78 24 78 27 82 C30 76 38 74 44 78 C50 72 62 72 68 78 C74 74 84 76 86 82 C92 78 100 80 102 86 C106 91 102 96 96 96 Z"/>
    <path d="M42 108 C36 108 32 103 34 97 C36 90 44 90 47 94 C50 88 58 86 64 90 C70 84 82 84 88 90 C94 86 104 88 106 94 C110 99 106 108 98 108 Z" opacity="0.8"/>
  </g>
</svg>