<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="Prayer Namaste">
  <defs>
    <!-- Background Divine Aura -->
    <radialGradient id="prayerAura" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#FFFDE7"/>
      <stop offset="35%" stop-color="#FFE082"/>
      <stop offset="70%" stop-color="#FF9800"/>
      <stop offset="100%" stop-color="#BF360C"/>
    </radialGradient>
    <!-- Divine Skin Tone -->
    <linearGradient id="prayerSkin" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFE0B2"/>
      <stop offset="30%" stop-color="#FFF3E0"/>
      <stop offset="50%" stop-color="#FFCC80"/>
      <stop offset="70%" stop-color="#FFF3E0"/>
      <stop offset="100%" stop-color="#FFE0B2"/>
    </linearGradient>
    <!-- Hand Shadow -->
    <linearGradient id="handShadow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFB74D"/>
      <stop offset="100%" stop-color="#E65100"/>
    </linearGradient>
    <!-- Sacred Kalawa / Raksha Thread Red & Yellow -->
    <linearGradient id="rakshaThread" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D50000"/>
      <stop offset="50%" stop-color="#FFD600"/>
      <stop offset="100%" stop-color="#D50000"/>
    </linearGradient>
    <!-- Golden Temple Bell -->
    <linearGradient id="pGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFDE7"/>
      <stop offset="30%" stop-color="#FFD54F"/>
      <stop offset="70%" stop-color="#FF8F00"/>
      <stop offset="100%" stop-color="#E65100"/>
    </linearGradient>
  </defs>

  <!-- Aura Circle -->
  <circle cx="64" cy="64" r="60" fill="url(#prayerAura)"/>

  <!-- Divine Sunburst Rays fanning out from the hands -->
  <g opacity="0.35" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round">
    <line x1="64" y1="52" x2="64" y2="12"/>
    <line x1="64" y1="52" x2="32" y2="18"/>
    <line x1="64" y1="52" x2="96" y2="18"/>
    <line x1="64" y1="52" x2="12" y2="40"/>
    <line x1="64" y1="52" x2="116" y2="40"/>
    <line x1="64" y1="52" x2="18" y2="68"/>
    <line x1="64" y1="52" x2="110" y2="68"/>
  </g>

  <!-- Hanging Golden Temple Bell in Background (Top Center) -->
  <g transform="translate(64, 20)">
    <!-- Bell Chain -->
    <line x1="0" y1="-14" x2="0" y2="0" stroke="#FFD54F" stroke-width="2.5"/>
    <!-- Bell Dome -->
    <path d="M-12 12 C-12 2 -8 0 0 0 C8 0 12 2 12 12 C14 16 16 18 16 20 L-16 20 C-16 18 -14 16 -12 12 Z" 
          fill="url(#pGold)"/>
    <ellipse cx="0" cy="20" rx="16" ry="4" fill="#BF360C"/>
    <!-- Clapper -->
    <circle cx="0" cy="22" r="3" fill="#FFF9C4"/>
  </g>

  <!-- Folded Divine Hands in Anjali Mudra / Namaste -->
  <!-- Left Hand & Fingers -->
  <path d="M64 26 C62 26 56 36 54 48 C52 56 46 64 42 74 C38 84 38 98 44 116 L56 118 C54 104 54 92 56 82 C58 74 62 66 64 62 Z" 
        fill="url(#prayerSkin)"/>
  <!-- Left Thumb -->
  <path d="M64 62 C58 64 52 70 52 78 C52 82 56 84 60 80 C62 76 64 70 64 62 Z" fill="#FFE0B2"/>

  <!-- Right Hand & Fingers (Mirrored with soft 3D lighting) -->
  <path d="M64 26 C66 26 72 36 74 48 C76 56 82 64 86 74 C90 84 90 98 84 116 L72 118 C74 104 74 92 72 82 C70 74 66 66 64 62 Z" 
        fill="url(#prayerSkin)"/>
  <!-- Right Thumb -->
  <path d="M64 62 C70 64 76 70 76 78 C76 82 72 84 68 80 C66 76 64 70 64 62 Z" fill="#FFCC80"/>

  <!-- Center Crease between Palms -->
  <line x1="64" y1="26" x2="64" y2="82" stroke="#E65100" stroke-width="1.8" stroke-linecap="round"/>

  <!-- Finger Knuckle & Joint Shading Lines -->
  <g stroke="#E65100" stroke-width="1.2" opacity="0.6">
    <path d="M57 44 C59 46 61 46 63 45"/>
    <path d="M65 45 C67 46 69 46 71 44"/>
    <path d="M55 54 C58 56 60 56 63 55"/>
    <path d="M65 55 C68 56 70 56 73 54"/>
  </g>

  <!-- Sacred Raksha / Mauli Thread on Wrists (Red & Yellow) -->
  <rect x="42" y="106" width="44" height="4.5" rx="2" fill="url(#rakshaThread)"/>
  <rect x="42" y="112" width="44" height="3" rx="1.5" fill="url(#rakshaThread)"/>

  <!-- Glowing Divine Sparkle at Finger Tips -->
  <polygon points="64,22 66,25 70,26 66,27 64,30 62,27 58,26 62,25" fill="#FFFFFF"/>
  <circle cx="64" cy="26" r="1.5" fill="#FFF9C4"/>
</svg>