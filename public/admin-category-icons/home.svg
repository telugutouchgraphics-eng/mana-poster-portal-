<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="All Categories Home">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="homeBg" cx="50%" cy="45%" r="58%">
      <stop offset="0%" stop-color="#E8F5E9"/>
      <stop offset="35%" stop-color="#C8E6C9"/>
      <stop offset="70%" stop-color="#4CAF50"/>
      <stop offset="100%" stop-color="#1B5E20"/>
    </radialGradient>
    <!-- Roof 3D Gradient -->
    <linearGradient id="roofRed" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF7043"/>
      <stop offset="40%" stop-color="#E64A19"/>
      <stop offset="100%" stop-color="#BF360C"/>
    </linearGradient>
    <!-- House Wall 3D Gradient -->
    <linearGradient id="houseWall" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ECEFF1"/>
      <stop offset="35%" stop-color="#FFFFFF"/>
      <stop offset="75%" stop-color="#CFD8DC"/>
      <stop offset="100%" stop-color="#B0BEC5"/>
    </linearGradient>
    <!-- Warm Window Light -->
    <radialGradient id="windowGlow" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="40%" stop-color="#FFF59D"/>
      <stop offset="80%" stop-color="#FFD54F"/>
      <stop offset="100%" stop-color="#FF9800"/>
    </radialGradient>
    <!-- Wooden Door -->
    <linearGradient id="woodDoor" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8D6E63"/>
      <stop offset="100%" stop-color="#4E342E"/>
    </linearGradient>
  </defs>

  <!-- Aura -->
  <circle cx="64" cy="64" r="60" fill="url(#homeBg)"/>

  <!-- House Shadow -->
  <ellipse cx="64" cy="116" rx="46" ry="8" fill="#1B5E20" opacity="0.4"/>

  <!-- Main House Structure -->
  <!-- Walls -->
  <rect x="28" y="58" width="72" height="52" rx="4" fill="url(#houseWall)"/>

  <!-- Chimney with smoke -->
  <rect x="80" y="24" width="10" height="20" fill="#BF360C"/>
  <rect x="78" y="22" width="14" height="4" rx="1" fill="#D84315"/>
  <!-- Smoke clouds -->
  <circle cx="86" cy="16" r="3.5" fill="#FFFFFF" opacity="0.6"/>
  <circle cx="90" cy="10" r="4.5" fill="#FFFFFF" opacity="0.5"/>
  <circle cx="96" cy="4" r="5" fill="#FFFFFF" opacity="0.35"/>

  <!-- Vibrant 3D Triangular Overhanging Roof -->
  <polygon points="64,16 16,58 112,58" fill="url(#roofRed)"/>
  <!-- Roof Ridge Highlight -->
  <path d="M64 16 L16 58 L22 58 L64 22 L106 58 L112 58 Z" fill="#FF8A65"/>
  <!-- Attic Round Window -->
  <circle cx="64" cy="42" r="7" fill="url(#windowGlow)"/>
  <circle cx="64" cy="42" r="7" fill="none" stroke="#BF360C" stroke-width="1.6"/>
  <line x1="64" y1="35" x2="64" y2="49" stroke="#BF360C" stroke-width="1.4"/>
  <line x1="57" y1="42" x2="71" y2="42" stroke="#BF360C" stroke-width="1.4"/>

  <!-- Ground Floor Doorway -->
  <path d="M54 110 L54 78 C54 74 58 72 64 72 C70 72 74 74 74 78 L74 110 Z" fill="url(#woodDoor)"/>
  <path d="M57 110 L57 80 C57 76 60 75 64 75 C68 75 71 76 71 80 L71 110 Z" fill="#5D4037"/>
  <!-- Golden Doorknob -->
  <circle cx="70" cy="94" r="2" fill="#FFD54F"/>

  <!-- Left Window (Warm Lit) -->
  <rect x="34" y="74" width="14" height="18" rx="2" fill="url(#windowGlow)"/>
  <rect x="34" y="74" width="14" height="18" rx="2" fill="none" stroke="#78909C" stroke-width="1.8"/>
  <line x1="41" y1="74" x2="41" y2="92" stroke="#78909C" stroke-width="1.4"/>
  <line x1="34" y1="83" x2="48" y2="83" stroke="#78909C" stroke-width="1.4"/>

  <!-- Right Window (Warm Lit) -->
  <rect x="80" y="74" width="14" height="18" rx="2" fill="url(#windowGlow)"/>
  <rect x="80" y="74" width="14" height="18" rx="2" fill="none" stroke="#78909C" stroke-width="1.8"/>
  <line x1="87" y1="74" x2="87" y2="92" stroke="#78909C" stroke-width="1.4"/>
  <line x1="80" y1="83" x2="94" y2="83" stroke="#78909C" stroke-width="1.4"/>

  <!-- Front Garden Grass / Plants at Base -->
  <ellipse cx="26" cy="110" rx="10" ry="6" fill="#43A047"/>
  <ellipse cx="102" cy="110" rx="10" ry="6" fill="#43A047"/>
  <circle cx="26" cy="107" r="2.5" fill="#E91E63"/>
  <circle cx="102" cy="107" r="2.5" fill="#FFEB3B"/>
</svg>