<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="Indian Flag">
  <defs>
    <!-- Background Sky/Patriotic Glow -->
    <radialGradient id="patrioticSky" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#E1F5FE" stop-opacity="1"/>
      <stop offset="45%" stop-color="#B3E5FC" stop-opacity="0.95"/>
      <stop offset="80%" stop-color="#0288D1" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#01579B" stop-opacity="0.95"/>
    </radialGradient>
    <!-- 3D Waving Saffron Fabric Gradient -->
    <linearGradient id="saffronWave" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF6F00"/>
      <stop offset="25%" stop-color="#FF9E40"/>
      <stop offset="50%" stop-color="#FF6D00"/>
      <stop offset="75%" stop-color="#FFA726"/>
      <stop offset="100%" stop-color="#E65100"/>
    </linearGradient>
    <!-- 3D Waving White Fabric Gradient -->
    <linearGradient id="whiteWave" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E0E0E0"/>
      <stop offset="25%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#ECEFF1"/>
      <stop offset="75%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#CFD8DC"/>
    </linearGradient>
    <!-- 3D Waving Green Fabric Gradient -->
    <linearGradient id="greenWave" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0A5D00"/>
      <stop offset="25%" stop-color="#2E7D32"/>
      <stop offset="50%" stop-color="#1B5E20"/>
      <stop offset="75%" stop-color="#43A047"/>
      <stop offset="100%" stop-color="#004D40"/>
    </linearGradient>
    <!-- Gold Flagpole Gradient -->
    <linearGradient id="goldPole" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFE082"/>
      <stop offset="40%" stop-color="#FFF9C4"/>
      <stop offset="70%" stop-color="#FFB300"/>
      <stop offset="100%" stop-color="#E65100"/>
    </linearGradient>
  </defs>

  <!-- Circular Outer Halo -->
  <circle cx="64" cy="64" r="60" fill="url(#patrioticSky)"/>

  <!-- Subtle Sunburst Rays Behind Flag -->
  <g opacity="0.25" stroke="#FFFFFF" stroke-width="1.5">
    <line x1="64" y1="64" x2="64" y2="10"/>
    <line x1="64" y1="64" x2="110" y2="30"/>
    <line x1="64" y1="64" x2="118" y2="64"/>
    <line x1="64" y1="64" x2="110" y2="98"/>
    <line x1="64" y1="64" x2="64" y2="118"/>
  </g>

  <!-- Golden Flagpole -->
  <!-- Pole Body -->
  <rect x="22" y="16" width="6" height="98" rx="2" fill="url(#goldPole)"/>
  <!-- Top Finial Sphere -->
  <circle cx="25" cy="14" r="5" fill="url(#goldPole)"/>
  <circle cx="23.5" cy="12.5" r="1.5" fill="#FFFFFF"/>
  <!-- Pole Base Pedestal -->
  <path d="M16 114 L34 114 L31 110 L19 110 Z" fill="url(#goldPole)"/>

  <!-- Flag Ties / Rings -->
  <rect x="21" y="24" width="8" height="2.5" rx="1" fill="#FFD54F"/>
  <rect x="21" y="78" width="8" height="2.5" rx="1" fill="#FFD54F"/>

  <!-- Waving Tricolor Flag Fabric -->
  <!-- 1. Top Saffron Band (Waved) -->
  <path d="M28 24 C45 20 62 28 82 22 C96 18 108 23 112 25 L112 43 C108 41 96 36 82 40 C62 46 45 38 28 42 Z" 
        fill="url(#saffronWave)"/>

  <!-- 2. Middle White Band (Waved) -->
  <path d="M28 42 C45 38 62 46 82 40 C96 36 108 41 112 43 L112 61 C108 59 96 54 82 58 C62 64 45 56 28 60 Z" 
        fill="url(#whiteWave)"/>

  <!-- 3. Bottom Green Band (Waved) -->
  <path d="M28 60 C45 56 62 64 82 58 C96 54 108 59 112 61 L112 79 C108 77 96 72 82 76 C62 82 45 74 28 78 Z" 
        fill="url(#greenWave)"/>

  <!-- Fabric Wave Shadow Overlay (Adds 3D Depth) -->
  <path d="M28 24 C45 20 62 28 82 22 C96 18 108 23 112 25 L112 79 C108 77 96 72 82 76 C62 82 45 74 28 78 Z" 
        fill="none" opacity="0.12"/>
  <path d="M48 22 C56 25 58 36 50 42 C44 48 44 60 52 64 C56 66 56 76 50 78" 
        fill="none" stroke="#000000" stroke-width="5" opacity="0.08"/>
  <path d="M82 22 C90 20 92 32 84 40 C78 46 80 58 86 62 C90 64 90 74 84 76" 
        fill="none" stroke="#FFFFFF" stroke-width="5" opacity="0.18"/>

  <!-- Realistic Navy Blue Ashoka Chakra in Center -->
  <g transform="translate(68, 50.5)">
    <!-- Chakra Outer Ring -->
    <circle cx="0" cy="0" r="7.8" fill="none" stroke="#000080" stroke-width="1.3"/>
    <!-- Chakra Center Hub -->
    <circle cx="0" cy="0" r="1.6" fill="#000080"/>
    <circle cx="0" cy="0" r="0.6" fill="#FFFFFF"/>
    <!-- 24 Distinct Spokes -->
    <g stroke="#000080" stroke-width="0.75" opacity="0.95">
      <line x1="0" y1="-7.5" x2="0" y2="7.5"/>
      <line x1="-7.5" y1="0" x2="7.5" y2="0"/>
      <line x1="-5.3" y1="-5.3" x2="5.3" y2="5.3"/>
      <line x1="5.3" y1="-5.3" x2="-5.3" y2="5.3"/>
      <line x1="-2.9" y1="-6.9" x2="2.9" y2="6.9"/>
      <line x1="2.9" y1="-6.9" x2="-2.9" y2="6.9"/>
      <line x1="-6.9" y1="-2.9" x2="6.9" y2="2.9"/>
      <line x1="6.9" y1="-2.9" x2="-6.9" y2="2.9"/>
      <line x1="-1.5" y1="-7.3" x2="1.5" y2="7.3"/>
      <line x1="1.5" y1="-7.3" x2="-1.5" y2="7.3"/>
      <line x1="-7.3" y1="-1.5" x2="7.3" y2="1.5"/>
      <line x1="7.3" y1="-1.5" x2="-7.3" y2="1.5"/>
    </g>
  </g>

  <!-- Golden Rope Tassel waving at pole -->
  <path d="M28 26 C24 32 18 36 21 44 C22 47 24 50 25 54" fill="none" stroke="#FFE082" stroke-width="1.6"/>
  <circle cx="25" cy="55" r="2.2" fill="#FFB300"/>
</svg>